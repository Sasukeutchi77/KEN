  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#crestGlow)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#crimsonSteel)" stroke-width="3" opacity="0.65"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#crimsonSteel)" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.45"/>

  <!-- Crossed blades behind sigil -->
  <line x1="116" y1="116" x2="396" y2="396" stroke="url(#crimsonSteel)" stroke-width="4" opacity="0.55"/>
  <line x1="396" y1="116" x2="116" y2="396" stroke="url(#crimsonSteel)" stroke-width="4" opacity="0.55"/>

  <!-- Ghoul Kakugan Eye in center -->
