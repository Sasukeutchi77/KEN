<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="crimsonSteel" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff1a35"/>
      <stop offset="0.5" stop-color="#8a0014"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="bloodFill" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff1e38"/>
      <stop offset="0.55" stop-color="#8b0016"/>
      <stop offset="1" stop-color="#280005"/>
