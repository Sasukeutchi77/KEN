  <path d="M256 448 L 240 362 L 256 340 L 272 362 Z" fill="url(#bloodFill)"/>
  <path d="M256 448 c-8 14-14 24-14 34a14 14 0 0028 0c0-10-6-20-14-34z" fill="url(#bloodFill)" opacity="0.95"/>
