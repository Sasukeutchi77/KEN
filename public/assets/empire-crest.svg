    <radialGradient id="crestGlow" cx="256" cy="256" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b0010" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
